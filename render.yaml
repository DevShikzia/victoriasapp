# Blueprint de Render para la API de MatiApp.
#
# - El frontend vive en Netlify (sitio estático).
# - La API necesita un proceso Node persistente por Socket.IO: no sirve
#   Netlify Functions.
# - MongoDB se aloja en MongoDB Atlas (M0 gratuito alcanza para empezar).
#
# Al crear el Blueprint, Render pide los valores marcados con `sync: false`.
# Mantené UNA sola instancia: el bus de tiempo real es en memoria.
services:
  - type: web
    name: matiapp-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build -w @victoriasapp/shared && npm run build -w @victoriasapp/api
    startCommand: npm run start -w @victoriasapp/api
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: COOKIE_SAMESITE
        value: none
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_USUARIO
        value: admin
      - key: ADMIN_NOMBRE
        value: Administrador
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FORZAR_RESET
        value: 'false'
