name: matiapp

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?falta MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?falta MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-matiapp}
      MONGO_DB: ${MONGO_DB:-matiapp}
      MONGO_APP_USER: ${MONGO_APP_USER:?falta MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?falta MONGO_APP_PASSWORD}
    # Sin `ports:`: solo alcanzable desde la red interna de Compose.
    command: ['mongod', '--wiredTigerCacheSizeGB', '0.25']
    volumes:
      - mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/10-app-user.js:ro
    networks:
      - backend
    logging: *default-logging
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 }).ok" | grep -q 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_APP_USER:?falta MONGO_APP_USER}:${MONGO_APP_PASSWORD:?falta MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DB:-matiapp}?authSource=${MONGO_DB:-matiapp}
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - backend
      - frontend
    logging: *default-logging
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 384m

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    # Solo loopback: el acceso público entra por Cloudflare Tunnel.
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8081}:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 96m

volumes:
  mongo-data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
