<section class="login">
  <div class="login__tarjeta">
    <div class="login__marca" aria-hidden="true">M</div>

    <div class="login__presentacion">
      <h1>MatiApp</h1>
      <p class="ayuda">Ingresá para gestionar los accesos de tu barrio.</p>
    </div>

    <form (ngSubmit)="ingresar()">
      <label class="campo">
        <span>Usuario</span>
        <input
          name="usuario"
          type="text"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          required
          [(ngModel)]="usuario"
          [disabled]="ocupado()"
        />
      </label>

      <label class="campo">
        <span>Contraseña</span>
        <input
          name="password"
          type="password"
          autocomplete="current-password"
          required
          [(ngModel)]="password"
          [disabled]="ocupado()"
        />
      </label>

      @if (error(); as mensaje) {
        <p class="error" role="alert">{{ mensaje }}</p>
      }

      <button type="submit" class="boton boton--acento boton--bloque" [disabled]="!puedeEnviar">
        {{ ocupado() ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>
  </div>
</section>
