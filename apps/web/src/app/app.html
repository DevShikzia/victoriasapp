<header class="barra">
  <span class="marca">Victorias · El Pare</span>

  <span class="estado" [class.estado--offline]="!enLinea()">
    @if (enLinea()) {
      <span class="punto punto--on"></span> En línea
    } @else {
      <span class="punto punto--off"></span> Sin conexión
    }
    @if (pendientes() > 0) {
      <span class="pendientes">{{ pendientes() }} pend.</span>
    }
  </span>

  @if (autenticado()) {
    <nav class="nav">
      <a routerLink="/visitas" routerLinkActive="activo">Visitas</a>
      <a routerLink="/panel" routerLinkActive="activo">Panel</a>
      <a routerLink="/visita/nueva" routerLinkActive="activo">Nueva</a>
      <a routerLink="/captura" routerLinkActive="activo">Captura</a>
      @if (puedeAdministrar()) {
        <a routerLink="/directorio" routerLinkActive="activo">Directorio</a>
      }
    </nav>

    <span class="sesion">
      <button type="button" class="btn-sync" (click)="sincronizar()" [disabled]="sincronizando()">
        {{ sincronizando() ? 'Sincronizando…' : 'Sincronizar' }}
      </button>
      <span class="quien">{{ usuario()?.nombre }} · {{ usuario()?.rol }}</span>
      <button type="button" class="btn-salir" (click)="salir()">Salir</button>
    </span>
  }
</header>

<main class="contenido">
  <router-outlet />
</main>
